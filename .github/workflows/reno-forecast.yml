name: Reno forecast notifier

on:
  # cron-job.org is the only scheduled trigger, at 3:05 PM UK time.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out notifier
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install time-zone data
        run: python -m pip install "tzdata>=2024.1"

      - name: Calculate Reno date
        id: reno-date
        run: echo "date=$(TZ=America/Los_Angeles date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore today's send state
        uses: actions/cache/restore@v4
        with:
          path: forecast_state.json
          key: reno-forecast-state-${{ steps.reno-date.outputs.date }}
          restore-keys: reno-forecast-state-

      - name: Check and send forecast
        env:
          EMAIL_ENABLED: "true"
          EMAIL_PROVIDER: "brevo"
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          FORECAST_RECIPIENT: ${{ secrets.FORECAST_RECIPIENT }}
          SEND_HOUR: "7"
          STATE_FILE: forecast_state.json
        run: python forecast_notifier.py --once

      - name: Save send state for this date
        if: hashFiles('forecast_state.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: forecast_state.json
          key: reno-forecast-state-${{ steps.reno-date.outputs.date }}